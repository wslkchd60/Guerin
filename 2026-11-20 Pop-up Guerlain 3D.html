<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pop-up Guerlain 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4ead7;
  --ink-dim:rgba(244,234,215,.62);
  --glass:rgba(14,16,28,.46);
  --line:rgba(255,226,170,.16);
  --gold:#d9b06a;
  --serif:"Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --sans:"Jost", "Futura", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#0b0f1d;color:var(--ink);font-family:var(--sans)}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
body.walk canvas#scene{cursor:crosshair}
body.dragging canvas#scene{cursor:grabbing}

.brand{position:fixed;top:max(20px,env(safe-area-inset-top));left:24px;display:flex;flex-direction:column;gap:4px;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.5),0 0 18px rgba(0,0,0,.55)}
.brand .mark{font-family:var(--serif);font-weight:600;font-size:1.375rem;letter-spacing:.32em}
.brand .sub{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim)}

.fs{position:fixed;top:max(18px,env(safe-area-inset-top));right:20px;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer;
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  transition:transform 160ms var(--ease-out),background-color 200ms var(--ease-out)}
.fs:active{transform:scale(.96)}
.fs svg{width:16px;height:16px}

.dock{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:12px;width:max-content;max-width:calc(100vw - 32px);pointer-events:none}
.seg{pointer-events:auto}
.hint{font-size:.8125rem;letter-spacing:.02em;color:var(--ink);text-align:center;padding:7px 14px;border-radius:999px;
  background:rgba(10,12,22,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:opacity 420ms var(--ease-out),filter 420ms var(--ease-out),transform 420ms var(--ease-out)}
.hint.off{opacity:0;filter:blur(4px);transform:translateY(4px)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%)}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;
  background:linear-gradient(180deg,#f3dba6,#c99a4f);box-shadow:0 2px 14px rgba(217,176,106,.35);
  transition:transform 280ms var(--ease-out)}
.seg[data-mode="walk"] .pill{transform:translateX(100%)}
.seg button{position:relative;z-index:1;appearance:none;border:0;background:none;cursor:pointer;
  font:500 .8125rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
  padding:12px 22px;min-width:118px;border-radius:999px;transition:color 220ms var(--ease-out),transform 160ms var(--ease-out)}
.seg button[aria-selected="true"]{color:#1d1508}
.seg button:active{transform:scale(.97)}
.seg button:focus-visible,.fs:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.veil{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;background:#0b0f1d;z-index:5;
  transition:opacity 900ms var(--ease-out),filter 900ms var(--ease-out)}
.veil span{font-family:var(--serif);font-weight:600;font-size:2rem;letter-spacing:.4em;padding-left:.4em}
.veil small{font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-dim)}
.veil.gone{opacity:0;filter:blur(6px);pointer-events:none}
.veil .err{max-width:30ch;text-align:center;font-size:.875rem;color:var(--ink-dim);letter-spacing:0;text-transform:none}

@media (max-width:520px){
  .brand{left:16px}.brand .mark{font-size:1.125rem}
  .fs{right:16px}
  .seg button{min-width:104px;padding:12px 16px}
}
@media (prefers-reduced-motion: reduce){
  .hint,.seg .pill,.seg button,.fs,.veil{transition:none}
  .hint.off{transform:none;filter:none}
}
</style>
</head>
<body>
<canvas id="scene" aria-label="Pavillon Guerlain en 3D : ailes d'abeille translucides, mur doré, comptoirs" tabindex="0"></canvas>
<div class="brand"><span class="mark">GUERLAIN</span><span class="sub">Les 200 Gestes · pop-up</span></div>
<button class="fs" id="fs" aria-label="Plein écran"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4"/></svg></button>
<div class="dock">
  <p class="hint" id="hint">Glisser pour tourner autour · molette pour approcher</p>
  <div class="seg" id="seg" role="tablist" data-mode="orbit">
    <span class="pill" aria-hidden="true"></span>
    <button role="tab" aria-selected="true" data-mode="orbit">Vue 3D</button>
    <button role="tab" aria-selected="false" data-mode="walk">Visite</button>
  </div>
</div>
<div class="veil" id="veil"><span>GUERLAIN</span><small>Les 200 Gestes</small></div>
